<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idea - 功能灵感记录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #fff;
    }

    h1 span {
      color: #888;
      font-weight: 400;
      font-size: 0.85rem;
      margin-left: 0.5rem;
    }

    .filters {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .filter-btn {
      padding: 0.35rem 0.7rem;
      background: transparent;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      color: #666;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      border-color: #444;
      color: #ccc;
      background: #1a1a1a;
    }

    .filter-btn:hover {
      color: #aaa;
    }

    .stats {
      font-size: 0.75rem;
      color: #555;
      margin-bottom: 1rem;
    }

    .idea-list {
      list-style: none;
    }

    .idea-item {
      border-bottom: 1px solid #1a1a1a;
    }

    .idea-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 0;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .idea-header:hover {
      opacity: 0.8;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      cursor: pointer;
      transition: all 0.2s;
    }

    .status-dot:hover {
      transform: scale(1.3);
    }

    .status-dot.pending { background: #f59e0b; }
    .status-dot.doing { background: #3b82f6; }
    .status-dot.done { background: #22c55e; }

    .idea-text {
      flex: 1;
      font-size: 0.88rem;
      color: #ccc;
    }

    .idea-item.done .idea-text {
      text-decoration: line-through;
      color: #555;
    }

    .idea-date {
      font-size: 0.7rem;
      color: #444;
      white-space: nowrap;
    }

    .expand-icon {
      font-size: 0.65rem;
      color: #444;
      transition: transform 0.2s;
      width: 16px;
      text-align: center;
    }

    .idea-item.expanded .expand-icon {
      transform: rotate(90deg);
    }

    .prototype-panel {
      display: none;
      padding: 0.8rem 1rem 0.8rem 1.5rem;
      margin-bottom: 0.5rem;
      background: #141414;
      border-left: 2px solid #2a2a2a;
      border-radius: 0 4px 4px 0;
      font-size: 0.82rem;
      line-height: 1.6;
      color: #999;
      animation: slideDown 0.2s ease;
    }

    .idea-item.expanded .prototype-panel {
      display: block;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .prototype-panel h4 {
      color: #bbb;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }

    .prototype-panel p {
      margin-bottom: 0.4rem;
    }

    .prototype-panel ul {
      padding-left: 1.2rem;
      margin-bottom: 0.5rem;
    }

    .prototype-panel li {
      margin-bottom: 0.2rem;
    }

    .prototype-panel .mockup {
      background: #1a1a1a;
      border: 1px solid #222;
      border-radius: 4px;
      padding: 0.8rem;
      font-family: monospace;
      font-size: 0.75rem;
      color: #666;
      white-space: pre;
      overflow-x: auto;
      margin-top: 0.5rem;
    }

    /* 动态演示样式 */
    .demo-sidebar {
      background: #141414;
      border: 1px solid #222;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 0.8rem;
      width: 240px;
    }

    .demo-sidebar-header {
      padding: 0.5rem 0.7rem;
      border-bottom: 1px solid #222;
      font-size: 0.72rem;
      color: #666;
    }

    .demo-session-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.7rem;
      font-size: 0.75rem;
      color: #999;
      transition: background 0.2s;
    }

    .demo-session-item:hover {
      background: #1a1a1a;
    }

    .demo-session-item .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #333;
    }

    .demo-session-item.active .dot {
      background: #3b82f6;
      box-shadow: 0 0 6px #3b82f660;
    }

    .demo-session-item .label {
      flex: 1;
    }

    .demo-session-item.active .label {
      color: #3b82f6;
    }

    .demo-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #333;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: demo-spin 0.8s linear infinite;
    }

    @keyframes demo-spin {
      to { transform: rotate(360deg); }
    }

    .demo-pulse {
      animation: demo-pulse 2s ease-in-out infinite;
    }

    @keyframes demo-pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .demo-typing {
      display: inline-flex;
      gap: 3px;
      align-items: center;
      height: 14px;
    }

    .demo-typing span {
      width: 4px;
      height: 4px;
      background: #3b82f6;
      border-radius: 50%;
      animation: demo-bounce 1.2s ease-in-out infinite;
    }

    .demo-typing span:nth-child(2) { animation-delay: 0.15s; }
    .demo-typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes demo-bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-4px); }
    }

    .demo-btn {
      padding: 0.25rem 0.5rem;
      background: #222;
      border: 1px solid #333;
      border-radius: 4px;
      color: #888;
      font-size: 0.68rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .demo-btn:hover {
      background: #2a2a2a;
      color: #bbb;
    }

    /* 三段式布局演示 */
    .demo-three-panel {
      display: flex;
      background: #141414;
      border: 1px solid #222;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 0.8rem;
      height: 220px;
    }

    .demo-nav-bar {
      width: 42px;
      background: #0d0d0d;
      border-right: 1px solid #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.5rem 0;
      gap: 0.3rem;
    }

    .demo-nav-icon {
      position: relative;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      color: #555;
      cursor: pointer;
      transition: all 0.2s;
    }

    .demo-nav-icon:hover {
      color: #999;
      background: #1a1a1a;
    }

    .demo-nav-icon.active {
      color: #3b82f6;
      background: #1a1a2a;
    }

    .demo-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      background: #ef4444;
      color: #fff;
      font-size: 0.55rem;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }

    .demo-content-area {
      flex: 1;
      border-right: 1px solid #222;
      overflow: hidden;
    }

    .demo-panel {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .demo-panel-header {
      padding: 0.5rem 0.7rem;
      border-bottom: 1px solid #222;
      font-size: 0.72rem;
      color: #666;
      font-weight: 500;
    }

    .demo-file-item, .demo-git-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.7rem;
      font-size: 0.72rem;
      color: #999;
      cursor: pointer;
      transition: background 0.15s;
    }

    .demo-file-item:hover, .demo-git-item:hover {
      background: #1a1a1a;
    }

    .demo-file-icon {
      font-size: 0.75rem;
    }

    .demo-git-status {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      font-weight: 600;
    }

    .demo-git-status.m { background: #f59e0b20; color: #f59e0b; }
    .demo-git-status.a { background: #22c55e20; color: #22c55e; }

    .demo-terminal {
      width: 180px;
      display: flex;
      flex-direction: column;
    }

    .demo-terminal-header {
      padding: 0.5rem 0.7rem;
      border-bottom: 1px solid #222;
      font-size: 0.72rem;
      color: #666;
    }

    .demo-terminal-content {
      flex: 1;
      padding: 0.5rem 0.7rem;
      font-family: monospace;
      font-size: 0.7rem;
      color: #22c55e;
    }

    /* 任务面板演示 */
    .demo-task-panel {
      background: #141414;
      border: 1px solid #222;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 0.8rem;
      width: 260px;
    }

    .demo-task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.7rem;
      border-bottom: 1px solid #222;
      font-size: 0.72rem;
      color: #888;
    }

    .demo-task-count {
      background: #1a2a3a;
      color: #3b82f6;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      font-size: 0.65rem;
    }

    .demo-task-list {
      padding: 0.3rem 0;
      max-height: 160px;
      overflow-y: auto;
    }

    .demo-task-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.7rem;
      font-size: 0.72rem;
      color: #666;
      transition: background 0.15s;
    }

    .demo-task-item:hover {
      background: #1a1a1a;
    }

    .demo-task-item.completed {
      color: #22c55e;
    }

    .demo-task-item.running {
      color: #3b82f6;
      background: #0d1a2a;
    }

    .demo-task-item.pending {
      color: #555;
    }

    .demo-task-icon {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
    }

    .demo-task-text {
      flex: 1;
    }

    .demo-task-progress {
      height: 3px;
      background: #1a1a1a;
    }

    .demo-task-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #22c55e);
      transition: width 0.5s ease;
    }

    /* 设置面板演示 */
    .demo-settings-panel {
      background: #141414;
      border: 1px solid #222;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 0.8rem;
      width: 320px;
    }

    .demo-settings-tabs {
      display: flex;
      border-bottom: 1px solid #222;
      background: #0d0d0d;
    }

    .demo-settings-tab {
      padding: 0.4rem 0.7rem;
      font-size: 0.68rem;
      color: #555;
      cursor: pointer;
      transition: all 0.2s;
    }

    .demo-settings-tab:hover {
      color: #888;
    }

    .demo-settings-tab.active {
      color: #3b82f6;
      border-bottom: 2px solid #3b82f6;
    }

    .demo-editor-area {
      padding: 0.4rem 0;
      font-family: monospace;
      font-size: 0.7rem;
      min-height: 120px;
    }

    .demo-editor-line {
      padding: 0.1rem 0.7rem;
      color: #888;
      display: flex;
      gap: 0.5rem;
    }

    .demo-editor-line.active-line {
      background: #1a1a2a;
    }

    .demo-line-num {
      color: #444;
      width: 20px;
      text-align: right;
    }

    .demo-keyword {
      color: #c678dd;
    }

    .demo-cursor {
      color: #3b82f6;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .demo-editor-status {
      display: flex;
      gap: 1rem;
      padding: 0.3rem 0.7rem;
      border-top: 1px solid #222;
      font-size: 0.6rem;
      color: #444;
    }

    /* MCP 面板演示 */
    .demo-mcp-panel {
      background: #141414;
      border: 1px solid #222;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 0.8rem;
      width: 280px;
    }

    .demo-mcp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.7rem;
      border-bottom: 1px solid #222;
      font-size: 0.72rem;
      color: #888;
    }

    .demo-mcp-list {
      padding: 0.3rem 0;
    }

    .demo-mcp-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 0.7rem;
      transition: background 0.15s;
    }

    .demo-mcp-item:hover {
      background: #1a1a1a;
    }

    .demo-mcp-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .demo-mcp-item.connected .demo-mcp-status {
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e60;
    }

    .demo-mcp-item.error .demo-mcp-status {
      background: #ef4444;
      box-shadow: 0 0 6px #ef444460;
    }

    .demo-mcp-info {
      flex: 1;
    }

    .demo-mcp-name {
      font-size: 0.75rem;
      color: #ccc;
    }

    .demo-mcp-detail {
      font-size: 0.62rem;
      color: #555;
    }

    .demo-mcp-tag {
      font-size: 0.58rem;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      background: #22c55e20;
      color: #22c55e;
    }

    .demo-mcp-tag.error {
      background: #ef444420;
      color: #ef4444;
    }

    /* 主页演示 */
    .demo-homepage {
      background: #141414;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 1rem;
      margin-top: 0.8rem;
      width: 380px;
    }

    .demo-welcome {
      margin-bottom: 1rem;
    }

    .demo-welcome-text {
      display: block;
      font-size: 1rem;
      color: #fff;
      font-weight: 600;
    }

    .demo-welcome-sub {
      font-size: 0.72rem;
      color: #555;
    }

    .demo-stats-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .demo-stat-card {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 0.5rem;
      text-align: center;
    }

    .demo-stat-card.highlight {
      border-color: #f59e0b40;
      background: #1a1500;
    }

    .demo-stat-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }

    .demo-stat-card.highlight .demo-stat-value {
      color: #f59e0b;
    }

    .demo-stat-label {
      font-size: 0.6rem;
      color: #555;
      margin-top: 0.2rem;
    }

    .demo-heatmap-container {
      background: #1a1a1a;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 0.6rem;
      margin-bottom: 0.8rem;
    }

    .demo-heatmap-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      font-size: 0.68rem;
      color: #666;
    }

    .demo-heatmap-legend {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.58rem;
      color: #444;
    }

    .demo-heatmap-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }

    .demo-heatmap-dot.l1 { background: #0e4429; }
    .demo-heatmap-dot.l2 { background: #006d32; }
    .demo-heatmap-dot.l3 { background: #26a641; }
    .demo-heatmap-dot.l4 { background: #39d353; }

    .demo-heatmap {
      display: grid;
      grid-template-columns: repeat(52, 1fr);
      gap: 2px;
    }

    .demo-heatmap-cell {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 2px;
      background: #161b22;
      transition: all 0.15s;
      cursor: pointer;
    }

    .demo-heatmap-cell:hover {
      outline: 1px solid #555;
    }

    .demo-heatmap-cell.l1 { background: #0e4429; }
    .demo-heatmap-cell.l2 { background: #006d32; }
    .demo-heatmap-cell.l3 { background: #26a641; }
    .demo-heatmap-cell.l4 { background: #39d353; }

    .demo-badges {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .demo-badge-item {
      padding: 0.3rem 0.6rem;
      background: #1a1a1a;
      border: 1px solid #222;
      border-radius: 20px;
      font-size: 0.65rem;
      color: #444;
      cursor: default;
    }

    .demo-badge-item.earned {
      color: #ccc;
      border-color: #333;
    }

    /* 语音输入演示 */
    .demo-voice-panel {
      background: #141414;
      border: 1px solid #222;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 0.8rem;
      width: 280px;
    }

    .demo-voice-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.7rem;
      border-bottom: 1px solid #222;
      font-size: 0.72rem;
      color: #888;
    }

    .demo-voice-status {
      font-size: 0.62rem;
      color: #22c55e;
    }

    .demo-voice-status.recording {
      color: #ef4444;
      animation: demo-pulse 1s infinite;
    }

    .demo-voice-visual {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.2rem;
      position: relative;
    }

    .demo-voice-waves {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 40px;
    }

    .demo-voice-bar {
      width: 4px;
      height: 8px;
      background: #333;
      border-radius: 2px;
      transition: height 0.1s ease;
    }

    .demo-voice-waves.active .demo-voice-bar {
      background: #3b82f6;
      animation: voiceWave 0.8s ease-in-out infinite;
    }

    .demo-voice-waves.active .demo-voice-bar:nth-child(1) { animation-delay: 0s; }
    .demo-voice-waves.active .demo-voice-bar:nth-child(2) { animation-delay: 0.1s; }
    .demo-voice-waves.active .demo-voice-bar:nth-child(3) { animation-delay: 0.2s; }
    .demo-voice-waves.active .demo-voice-bar:nth-child(4) { animation-delay: 0.3s; }
    .demo-voice-waves.active .demo-voice-bar:nth-child(5) { animation-delay: 0.4s; }
    .demo-voice-waves.active .demo-voice-bar:nth-child(6) { animation-delay: 0.5s; }
    .demo-voice-waves.active .demo-voice-bar:nth-child(7) { animation-delay: 0.4s; }
    .demo-voice-waves.active .demo-voice-bar:nth-child(8) { animation-delay: 0.3s; }
    .demo-voice-waves.active .demo-voice-bar:nth-child(9) { animation-delay: 0.2s; }
    .demo-voice-waves.active .demo-voice-bar:nth-child(10) { animation-delay: 0.1s; }
    .demo-voice-waves.active .demo-voice-bar:nth-child(11) { animation-delay: 0s; }
    .demo-voice-waves.active .demo-voice-bar:nth-child(12) { animation-delay: 0.1s; }

    @keyframes voiceWave {
      0%, 100% { height: 8px; }
      50% { height: 32px; }
    }

    .demo-voice-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #1a1a1a;
      border: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      cursor: pointer;
      transition: all 0.2s;
    }

    .demo-voice-icon:hover {
      border-color: #3b82f6;
      color: #3b82f6;
    }

    .demo-voice-icon.recording {
      border-color: #ef4444;
      color: #ef4444;
      background: #1a0000;
      animation: demo-pulse 1s infinite;
    }

    .demo-voice-hint {
      text-align: center;
      font-size: 0.65rem;
      color: #444;
      padding: 0 0.7rem;
    }

    .demo-voice-result {
      margin: 0.5rem 0.7rem 0.7rem;
      padding: 0.5rem;
      background: #1a1a1a;
      border-radius: 4px;
      min-height: 32px;
    }

    .demo-voice-text {
      font-size: 0.72rem;
      color: #555;
    }

    .demo-voice-text.active {
      color: #ccc;
    }

    .empty {
      text-align: center;
      padding: 3rem 0;
      color: #333;
      font-size: 0.85rem;
    }

    .legend {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid #1a1a1a;
      display: flex;
      gap: 1.5rem;

      {

        status: "done",
        date: "06-04 10:15:42",

    // ==============================

    let currentFilter = 'all';

    function cycleStatus(index) {
      const order = ['pending', 'doing', 'done'];
      const current = order.indexOf(ideas[index].status);
      ideas[index].status = order[(current + 1) % 3];
      render();
    }

    function toggleExpand(index) {
      const item = document.querySelector(`[data-index="${index}"]`);
      if (item) {
        item.classList.toggle('expanded');
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      render();
    }

    function render() {
      const filtered = currentFilter === 'all'
        ? ideas
        : ideas.filter(i => i.status === currentFilter);

      const counts = { pending: 0, doing: 0, done: 0 };
      ideas.forEach(i => counts[i.status]++);

      document.getElementById('stats').textContent =
        `共 ${ideas.length} 条想法 · 待实现 ${counts.pending} · 进行中 ${counts.doing} · 已完成 ${counts.done}`;

      const list = document.getElementById('ideaList');
      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty">暂无想法</div>';
        return;
      }

      list.innerHTML = filtered.map((idea, _) => {
        const realIndex = ideas.indexOf(idea);
        const hasPrototype = idea.prototype && idea.prototype.trim();
        return `
          <li class="idea-item ${idea.status}" data-index="${realIndex}">
            <div class="idea-header" onclick="${hasPrototype ? `toggleExpand(${realIndex})` : ''}">
              <div class="status-dot ${idea.status}" onclick="event.stopPropagation(); cycleStatus(${realIndex})" title="点击切换状态"></div>
              <span class="idea-text">${escapeHtml(idea.text)}</span>
              <span class="idea-date">${idea.date}</span>
              ${hasPrototype ? '<span class="expand-icon">▶</span>' : ''}
            </div>
            ${hasPrototype ? `<div class="prototype-panel">${idea.prototype}</div>` : ''}
          </li>`;
      }).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 三段式布局面板切换
    function switchPanel(panel) {
      // 更新导航图标状态
      document.querySelectorAll('.demo-nav-icon').forEach(icon => icon.classList.remove('active'));
      event.currentTarget.classList.add('active');

      // 切换面板显示
      document.querySelectorAll('.demo-panel').forEach(p => p.style.display = 'none');
      document.querySelector(`.demo-panel-${panel}`).style.display = 'flex';
    }

    // 生成 Heatmap 数据
    function generateHeatmap() {
      const heatmap = document.getElementById('heatmap');
      if (!heatmap) return;

      heatmap.innerHTML = '';
      const levels = ['', 'l1', 'l2', 'l3', 'l4'];

      for (let week = 0; week < 52; week++) {
        for (let day = 0; day < 7; day++) {
          const cell = document.createElement('div');
          cell.className = 'demo-heatmap-cell';

          // 随机生成活动等级，越近的日期活动越高
          const recency = week / 52;
          const rand = Math.random();
          let level = 0;
          if (rand < 0.3 + recency * 0.3) level = 1;
          if (rand < 0.15 + recency * 0.2) level = 2;
          if (rand < 0.05 + recency * 0.15) level = 3;
          if (rand < 0.02 + recency * 0.08) level = 4;

          if (level > 0) cell.classList.add(levels[level]);

          // Tooltip
          const contributions = level * Math.floor(Math.random() * 5 + 1);
          cell.title = contributions > 0 ? `${contributions} 次贡献` : '无贡献';

          heatmap.appendChild(cell);
        }
      }
    }

    // 初始化 Heatmap
    generateHeatmap();

    // 语音输入演示
    function toggleVoice() {
      const icon = document.querySelector('.demo-voice-icon');
      const waves = document.getElementById('voiceWaves');
      const status = document.querySelector('.demo-voice-status');
      const text = document.querySelector('.demo-voice-text');

      if (icon.classList.contains('recording')) {
        // 停止录音
        icon.classList.remove('recording');
        waves.classList.remove('active');
        status.classList.remove('recording');
        status.textContent = '就绪';
        text.classList.add('active');
        text.textContent = '你好，这是一段语音识别的演示结果';
      } else {
        // 开始录音
        icon.classList.add('recording');
        waves.classList.add('active');
        status.classList.add('recording');
        status.textContent = '录音中...';
        text.classList.remove('active');
        text.textContent = '正在识别...';
      }
    }

    render();
  </script>
