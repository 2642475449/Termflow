<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bug 记录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #fff;
    }

    h1 span {
      color: #888;
      font-weight: 400;
      font-size: 0.85rem;
      margin-left: 0.5rem;
    }

    .add-btn {
      padding: 0.5rem 1rem;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #ccc;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .add-btn:hover {
      background: #252525;
      border-color: #444;
    }

    .filters {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .filter-btn {
      padding: 0.35rem 0.7rem;
      background: transparent;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      color: #666;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      border-color: #444;
      color: #ccc;
      background: #1a1a1a;
    }

    .filter-btn:hover {
      color: #aaa;
    }

    .stats {
      font-size: 0.75rem;
      color: #555;
      margin-bottom: 1rem;
    }

    .bug-list {
      list-style: none;
    }

    .bug-item {
      border-bottom: 1px solid #1a1a1a;
    }

    .bug-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 0;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .bug-header:hover {
      opacity: 0.8;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      cursor: pointer;
      transition: all 0.2s;
    }

    .status-dot:hover {
      transform: scale(1.3);
    }

    .status-dot.open { background: #ef4444; }
    .status-dot.fixing { background: #f59e0b; }
    .status-dot.closed { background: #22c55e; }

    .bug-title {
      flex: 1;
      font-size: 0.88rem;
      color: #ccc;
    }

    .bug-item.closed .bug-title {
      text-decoration: line-through;
      color: #555;
    }

    .bug-severity {
      font-size: 0.65rem;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      font-weight: 500;
    }

    .bug-severity.critical { background: #ef444420; color: #ef4444; }
    .bug-severity.major { background: #f59e0b20; color: #f59e0b; }
    .bug-severity.minor { background: #3b82f620; color: #3b82f6; }

    .bug-date {
      font-size: 0.7rem;
      color: #444;
      white-space: nowrap;
    }

    .expand-icon {
      font-size: 0.65rem;
      color: #444;
      transition: transform 0.2s;
      width: 16px;
      text-align: center;
    }

    .bug-item.expanded .expand-icon {
      transform: rotate(90deg);
    }

    .bug-detail {
      display: none;
      padding: 0.8rem 1rem 0.8rem 1.5rem;
      margin-bottom: 0.5rem;
      background: #141414;
      border-left: 2px solid #2a2a2a;
      border-radius: 0 4px 4px 0;
      font-size: 0.82rem;
      line-height: 1.6;
      color: #999;
      animation: slideDown 0.2s ease;
    }

    .bug-item.expanded .bug-detail {
      display: block;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bug-detail h4 {
      color: #bbb;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }

    .bug-detail p {
      margin-bottom: 0.4rem;
    }

    .bug-detail .steps {
      background: #1a1a1a;
      border: 1px solid #222;
      border-radius: 4px;
      padding: 0.6rem 0.8rem;
      font-family: monospace;
      font-size: 0.75rem;
      color: #666;
      white-space: pre-wrap;
      margin: 0.5rem 0;
    }

    .bug-detail .info-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 0.3rem;
    }

    .bug-detail .info-label {
      color: #555;
      min-width: 60px;
    }

    .empty {
      text-align: center;
      padding: 3rem 0;
      color: #333;
      font-size: 0.85rem;
    }

    .legend {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid #1a1a1a;
      display: flex;
      gap: 1.5rem;
      font-size: 0.7rem;
      color: #444;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* 添加 Bug 弹窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      width: 480px;
      max-width: 90vw;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      border-bottom: 1px solid #222;
    }

    .modal-header h3 {
      font-size: 1rem;
      color: #fff;
      font-weight: 500;
    }

    .modal-close {
      background: none;
      border: none;
      color: #666;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.2rem;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: #ccc;
    }

    .modal-body {
      padding: 1rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 0.4rem;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.5rem 0.7rem;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 4px;
      color: #ccc;
      font-size: 0.82rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #555;
    }

    .form-group textarea {
      min-height: 80px;
      resize: vertical;
    }

    .form-row {
      display: flex;
      gap: 1rem;
    }

    .form-row .form-group {
      flex: 1;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      padding: 1rem;
      border-top: 1px solid #222;
    }

    .btn-cancel {
      padding: 0.4rem 0.8rem;
      background: transparent;
      border: 1px solid #333;
      border-radius: 4px;
      color: #888;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cancel:hover {
      background: #222;
      color: #ccc;
    }

    .btn-submit {
      padding: 0.4rem 0.8rem;
      background: #3b82f6;
      border: 1px solid #3b82f6;
      border-radius: 4px;
      color: #fff;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-submit:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Bug <span>记录与追踪</span></h1>
      <button class="add-btn" onclick="openModal()">+ 新建 Bug</button>
    </header>

    <div class="filters">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">全部</button>
      <button class="filter-btn" data-filter="open" onclick="setFilter('open')">待修复</button>
      <button class="filter-btn" data-filter="fixing" onclick="setFilter('fixing')">修复中</button>
      <button class="filter-btn" data-filter="closed" onclick="setFilter('closed')">已关闭</button>
    </div>

    <div class="stats" id="stats"></div>

    <ul class="bug-list" id="bugList"></ul>

    <div class="legend">
      <div class="legend-item"><div class="status-dot open"></div> 待修复</div>
      <div class="legend-item"><div class="status-dot fixing"></div> 修复中</div>
      <div class="legend-item"><div class="status-dot closed"></div> 已关闭</div>
    </div>
  </div>

  <!-- 添加 Bug 弹窗 -->
  <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header">
        <h3>新建 Bug</h3>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>标题</label>
          <input type="text" id="bugTitle" placeholder="简要描述 bug">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>严重程度</label>
            <select id="bugSeverity">
              <option value="minor">Minor - 轻微</option>
              <option value="major" selected>Major - 严重</option>
              <option value="critical">Critical - 致命</option>
            </select>
          </div>
          <div class="form-group">
            <label>状态</label>
            <select id="bugStatus">
              <option value="open" selected>待修复</option>
              <option value="fixing">修复中</option>
              <option value="closed">已关闭</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>复现步骤</label>
          <textarea id="bugSteps" placeholder="1. 打开应用&#10;2. 点击xxx&#10;3. 观察到错误"></textarea>
        </div>
        <div class="form-group">
          <label>期望行为</label>
          <input type="text" id="bugExpected" placeholder="应该发生什么">
        </div>
        <div class="form-group">
          <label>实际行为</label>
          <input type="text" id="bugActual" placeholder="实际发生了什么">
        </div>
        <div class="form-group">
          <label>环境信息</label>
          <input type="text" id="bugEnvironment" placeholder="如：Windows 11, Chrome 120, Node 18">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-submit" onclick="addBug()">添加</button>
      </div>
    </div>
  </div>

  <script>
    // ===== Bug 数据 =====
    let bugs = [
      {
        title: "同时打开两个项目时，先打开的会话会被中断",
        status: "open",
        severity: "critical",
        date: "06-22 09:35:00",
        steps: "1. 打开项目 A（如 dubhe），启动会话并执行任务\n2. 在任务执行过程中，打开项目 B（如 Termflow）\n3. 项目 B 的会话启动后，项目 A 的会话被中断",
        expected: "两个项目的会话可以同时独立运行，互不影响",
        actual: "先打开的项目会话被中断，任务执行失败",
        environment: "Windows 11, Termflow v1.7.7"
      },
      {
        title: "Git 提交遇到多文件或复杂文件类型暂存后点击提交按钮无响应",
        status: "open",
        severity: "critical",
        date: "06-22 10:02:15",
        steps: "1. 在 Git 面板选择多个文件进行暂存（或暂存包含复杂文件类型的变更）\n2. 在提交输入框输入提交信息\n3. 点击提交按钮",
        expected: "正常执行 git commit，提交成功并刷新状态",
        actual: "点击提交按钮后没有任何反应，提交未执行",
        environment: "Windows 11, Termflow v1.7.7"
      },
      {
        title: "会话列表在窗口缩小时显示错位",
        status: "open",
        severity: "critical",
        date: "06-22 09:35:00",
        steps: "1. 打开项目 A（如 dubhe），启动会话并执行任务\n2. 在任务执行过程中，打开项目 B（如 Termflow）\n3. 项目 B 的会话启动后，项目 A 的会话被中断",
        expected: "两个项目的会话可以同时独立运行，互不影响",
        actual: "先打开的项目会话被中断，任务执行失败",
        environment: "Windows 11, Termflow v1.7.7"
      },
      {
        title: "会话列表在窗口缩小时显示错位",
        status: "open",
        severity: "major",
        date: "06-20 14:32:18",
        steps: "1. 打开应用，展开左侧会话列表\n2. 将窗口宽度拖动至 800px 以下\n3. 观察会话项的图标和文字重叠",
        expected: "会话项自适应宽度，图标和文字正常排列",
        actual: "图标和文字重叠，部分文字被截断",
        environment: "Windows 11, Electron 28"
      },
      {
        title: "终端输入中文时偶尔出现乱码",
        status: "fixing",
        severity: "critical",
        date: "06-19 09:15:42",
        steps: "1. 在终端中快速输入中文\n2. 连续输入超过 20 个字符\n3. 偶发出现编码错误的字符",
        expected: "中文正常显示，无乱码",
        actual: "快速输入时偶尔出现编码错误字符",
        environment: "Windows 11, PowerShell 7.4"
      },
      {
        title: "Git 分支切换后文件状态未刷新",
        status: "open",
        severity: "minor",
        date: "06-18 16:45:33",
        steps: "1. 在 Git 面板切换分支\n2. 切换后观察文件变更列表",
        expected: "文件列表更新为当前分支的变更",
        actual: "文件列表仍显示切换前分支的状态",
        environment: "Windows 11, Git 2.43"
      },
      {
        title: "设置页面保存配置后需要重启才生效",
        status: "closed",
        severity: "major",
        date: "06-15 11:22:08",
        steps: "1. 打开设置页面\n2. 修改主题配置\n3. 点击保存\n4. 观察界面变化",
        expected: "保存后立即应用新配置",
        actual: "需要重启应用才能看到变化",
        environment: "Windows 11, v1.7.5"
      }
    ];

    let currentFilter = 'all';

    function cycleStatus(index) {
      const order = ['open', 'fixing', 'closed'];
      const current = order.indexOf(bugs[index].status);
      bugs[index].status = order[(current + 1) % 3];
      render();
    }

    function toggleExpand(index) {
      const item = document.querySelector(`[data-index="${index}"]`);
      if (item) {
        item.classList.toggle('expanded');
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      render();
    }

    function render() {
      const filtered = currentFilter === 'all'
        ? bugs
        : bugs.filter(b => b.status === currentFilter);

      const counts = { open: 0, fixing: 0, closed: 0 };
      bugs.forEach(b => counts[b.status]++);

      document.getElementById('stats').textContent =
        `共 ${bugs.length} 个 Bug · 待修复 ${counts.open} · 修复中 ${counts.fixing} · 已关闭 ${counts.closed}`;

      const list = document.getElementById('bugList');
      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty">暂无 Bug</div>';
        return;
      }

      list.innerHTML = filtered.map((bug, _) => {
        const realIndex = bugs.indexOf(bug);
        const severityMap = { critical: 'Critical', major: 'Major', minor: 'Minor' };
        return `
          <li class="bug-item ${bug.status}" data-index="${realIndex}">
            <div class="bug-header" onclick="toggleExpand(${realIndex})">
              <div class="status-dot ${bug.status}" onclick="event.stopPropagation(); cycleStatus(${realIndex})" title="点击切换状态"></div>
              <span class="bug-title">${escapeHtml(bug.title)}</span>
              <span class="bug-severity ${bug.severity}">${severityMap[bug.severity]}</span>
              <span class="bug-date">${bug.date}</span>
              <span class="expand-icon">▶</span>
            </div>
            <div class="bug-detail">
              <div class="info-row">
                <span class="info-label">环境：</span>
                <span>${escapeHtml(bug.environment)}</span>
              </div>
              <h4>复现步骤</h4>
              <div class="steps">${escapeHtml(bug.steps)}</div>
              <h4>期望行为</h4>
              <p>${escapeHtml(bug.expected)}</p>
              <h4>实际行为</h4>
              <p>${escapeHtml(bug.actual)}</p>
            </div>
          </li>`;
      }).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function openModal() {
      document.getElementById('modalOverlay').classList.add('active');
      document.getElementById('bugTitle').focus();
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      // 清空表单
      document.getElementById('bugTitle').value = '';
      document.getElementById('bugSteps').value = '';
      document.getElementById('bugExpected').value = '';
      document.getElementById('bugActual').value = '';
      document.getElementById('bugEnvironment').value = '';
    }

    function addBug() {
      const title = document.getElementById('bugTitle').value.trim();
      if (!title) {
        alert('请输入 Bug 标题');
        return;
      }

      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const date = `${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

      bugs.unshift({
        title: title,
        status: document.getElementById('bugStatus').value,
        severity: document.getElementById('bugSeverity').value,
        date: date,
        steps: document.getElementById('bugSteps').value || '无',
        expected: document.getElementById('bugExpected').value || '无',
        actual: document.getElementById('bugActual').value || '无',
        environment: document.getElementById('bugEnvironment').value || '未知'
      });

      closeModal();
      render();
    }

    // 键盘快捷键
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    render();
  </script>
</body>
</html>
