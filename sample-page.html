<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Termflow · 示例页</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #161a23;
      --border: #232838;
      --text: #d6dae6;
      --muted: #7a8196;
      --primary: #6ad0b1;
      --accent: #8aa2ff;
      --warning: #e6b566;
      --danger: #ff7a90;
      --radius: 12px;
      --mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(1200px 600px at 50% -10%, #1b2130 0%, var(--bg) 60%);
      font-family: var(--mono);
      color: var(--text);
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 640px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    /* 窗口标题栏 */
    .titlebar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: #1a1f2b;
      border-bottom: 1px solid var(--border);
      user-select: none;
    }

    .titlebar .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }

    .titlebar .title {
      flex: 1;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* 提示行 */
    .prompt-line {
      display: flex;
      gap: 8px;
      padding: 8px 0;
      color: var(--muted);
    }

    .prompt-line .user { color: var(--primary); font-weight: bold; }
    .prompt-line .dir { color: var(--accent); }

    /* 输出块 */
    .output { padding: 16px 20px 20px; }

    .output .cmd {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .output .cmd .prompt {
      color: var(--primary);
      white-space: nowrap;
    }

    .output .cmd .input {
      color: var(--text);
      word-break: break-all;
    }

    /* 终端文本闪烁光标 */
    .cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background: var(--primary);
      vertical-align: middle;
      margin-left: 2px;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    /* 代码块 */
    .code-block {
      background: #0c0f16;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      margin: 12px 0;
      font-size: 13px;
      line-height: 1.7;
      overflow-x: auto;
    }

    .code-block .k { color: var(--primary); }
    .code-block .s { color: var(--warning); }
    .code-block .c { color: var(--muted); font-style: italic; }
    .code-block .f { color: var(--accent); }

    /* 状态行 */
    .statusbar {
      display: flex;
      gap: 16px;
      padding: 10px 16px;
      background: #1a1f2b;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    .statusbar .ok { color: var(--primary); }
    .statusbar .warn { color: var(--warning); }
    .statusbar .bad { color: var(--danger); }
    .statusbar .spacer { flex: 1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="titlebar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="title">termflow — zsh</span>
    </div>

    <div class="output">
      <div class="cmd">
        <span class="prompt">➜</span>
        <span class="input">whoami</span>
      </div>
      <div class="code-block"><span class="c"># 欢迎使用 Termflow —— 一个现代化终端管理器</span></div>

      <div class="cmd">
        <span class="prompt">➜</span>
        <span class="input">cat README.md | head -n 3</span>
      </div>
      <div class="code-block">
        <span class="k">多标签</span> 分屏布局，流畅切换<br>
        <span class="k">高性能</span> PTY 会话，毫秒级响应<br>
        <span class="k">可扩展</span> 主题系统 + 自定义配置
      </div>

      <div class="cmd">
        <span class="prompt">➜</span>
        <span class="input">pnpm dev <span class="cursor"></span></span>
      </div>
    </div>

    <div class="statusbar">
      <span class="ok">● dev</span>
      <span>pnpm 10</span>
      <span class="spacer"></span>
      <span class="warn">main</span>
      <span>UTF-8</span>
      <span class="bad">·</span>
    </div>
  </div>
</body>
</html>
