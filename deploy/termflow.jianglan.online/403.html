<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>这里不开放哦 · Termflow</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: radial-gradient(circle at 18% 18%, #7255ca 0, transparent 24rem), radial-gradient(circle at 84% 82%, #236b82 0, #10152b 34rem);
        color: #f7f4ff;
        display: flex;
        font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
      main { max-width: 38rem; padding: 1.5rem; text-align: center; }
      .card { background: #19213dcc; border: 1px solid #ffffff26; border-radius: 2rem; box-shadow: 0 1.5rem 5rem #05071480; padding: 3.25rem 2rem; }
      .orb { animation: bob 2.6s ease-in-out infinite; font-size: 5.5rem; line-height: 1; margin-bottom: 1rem; }
      h1 { font-size: clamp(2rem, 8vw, 3.6rem); letter-spacing: -.06em; margin: 0; }
      p { color: #c8d0ef; font-size: 1.05rem; line-height: 1.8; margin: 1rem auto 1.8rem; max-width: 28rem; }
      a { background: #a9c7ff; border-radius: 999px; color: #16203c; display: inline-block; font-weight: 800; padding: .8rem 1.25rem; text-decoration: none; }
      small { color: #8e9abc; display: block; margin-top: 1.35rem; }
      @keyframes bob { 50% { transform: translateY(-.65rem) rotate(5deg); } }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <div class="orb" aria-hidden="true">🧸</div>
        <h1>这里暂不开放哦</h1>
        <p>这个地址是 Termflow 的更新文件区，为了安全起见不能直接浏览。不过你可以回到首页看看。</p>
        <a href="/">回到 Termflow 首页</a>
        <small>403 · 访问被小熊礼貌地拦下了</small>
      </section>
    </main>
  </body>
</html>
